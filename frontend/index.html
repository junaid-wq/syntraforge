<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SyntraForge | Viral Hook Generator</title>
  <style>
    :root {
      --bg-color: #050505;
      --card-bg: #111111;
      --border-color: #222222;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #3b82f6;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin-top: 3rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.05em;
      margin-bottom: 0.5rem;
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .input-group {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    input {
      flex: 1;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 1rem;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--accent);
    }

    button {
      background-color: var(--text-main);
      color: var(--bg-color);
      border: none;
      padding: 0 1.5rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    #results {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .hook-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 1.25rem;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .hook-text {
      font-size: 1rem;
      line-height: 1.4;
      font-weight: 500;
    }

    .copy-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
    }

    .copy-btn:hover {
      background: var(--border-color);
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Viral Hook Generator</h1>
      <p>Type your niche. Get proven hooks that hold retention.</p>
    </header>

    <div class="input-group">
      <input type="text" id="topicInput" placeholder="e.g. video editing, day trading, fitness..." autocomplete="off">
      <button onclick="generateHooks()">Generate</button>
    </div>

    <div id="results">
      <!-- Generated hooks will appear here -->
    </div>
  </div>

  <script>
    const templates = [
      "The dark truth about {topic} they don't want you to know 🤫",
      "Stop doing {topic} like this (it's ruining your progress) 🛑",
      "I spent 100 hours researching {topic} so you don't have to 🧠",
      "Why 99% of people fail at {topic} (and how to be the 1%) 📈",
      "The ultimate cheat sheet for {topic} in 2026 📝",
      "3 {topic} secrets your competitors are hiding from you 🕵️",
      "If you want to master {topic}, you need to watch this right now ⏰",
      "How to actually get good at {topic} without burning out 🔥",
      "This one simple {topic} trick changed my life 🤯",
      "Nobody is talking about this {topic} strategy... 🗣️"
    ];

    function generateHooks() {
      const input = document.getElementById('topicInput').value.trim();
      const resultsContainer = document.getElementById('results');
      
      if (!input) {
        alert("Please enter a topic first.");
        return;
      }

      // Clear previous
      resultsContainer.innerHTML = '';

      // Shuffle and pick 5 templates
      const shuffled = [...templates].sort(() => 0.5 - Math.random());
      const selected = shuffled.slice(0, 5);

      selected.forEach(template => {
        const finalHook = template.replace(/{topic}/g, input);
        
        const card = document.createElement('div');
        card.className = 'hook-card';
        
        card.innerHTML = `
          <div class="hook-text">${finalHook}</div>
          <button class="copy-btn" onclick="copyToClipboard(this, '${finalHook.replace(/'/g, "\\'")}')">Copy</button>
        `;
        
        resultsContainer.appendChild(card);
      });
    }

    function copyToClipboard(btnElement, text) {
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btnElement.innerText;
        btnElement.innerText = 'Copied!';
        btnElement.style.color = '#10b981';
        btnElement.style.borderColor = '#10b981';
        
        setTimeout(() => {
          btnElement.innerText = originalText;
          btnElement.style.color = '';
          btnElement.style.borderColor = '';
        }, 2000);
      });
    }
  </script>
</body>
</html>
